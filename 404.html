<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Página não encontrada — PLACAR</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script>
    /* GitHub Pages serve esta página em qualquer caminho inexistente.
       Calcula a base do site para o CSS e as ligações funcionarem num subcaminho. */
    (function () {
      var parts = location.pathname.split("/").filter(Boolean);
      var isProject = location.hostname.endsWith("github.io") && parts.length > 0;
      var base = isProject ? "/" + parts[0] + "/" : "/";
      document.write('<base href="' + base + '">');
    })();
  </script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="nf">
    <div>
      <a class="brand" href="./"><span class="brand-dots" aria-hidden="true"><i></i><i></i></span>PLACAR</a>
      <h1>Falta aqui um ponto.</h1>
      <p>A página que procuras não existe ou mudou de sítio.</p>
      <a class="btn btn--primary btn--lg" href="./">Voltar ao início</a>
    </div>
  </main>
</body>
</html>
